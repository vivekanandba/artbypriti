# Validation for pull requests. The deploy workflow (hugo.yml) only runs after a merge to
# main, so without this nothing checks a change before it reaches production.
#
# Two jobs on purpose: `check` is seconds and catches the defect classes that have actually
# shipped here; `visual` costs a container pull and runs separately so a content typo does
# not wait on a browser.
name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Keep in step with hugo.yml.
  HUGO_VERSION: 0.147.8

jobs:
  check:
    name: content, build, output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: the spec-required check diffs against the PR's base branch.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Spec-first: a change to templates, config, CI or scripts must either come with a
      # spec under specs/ or record `No-Spec: <reason>`. The escape hatch is intentional --
      # a gate with no way out gets routed around, and then protects nothing.
      - name: Require recorded intent
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-specs.py --diff-base origin/${{ github.base_ref }}
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      # Shares the deploy workflow's cache key, so PRs usually reuse variants the last deploy
      # already generated instead of rebuilding all 187. A miss on a branch's first run is
      # normal: GitHub scopes caches by ref (a PR run reads main's cache but writes its own).
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources/_gen
          key: hugo-img-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'hugo.toml') }}
          restore-keys: |
            hugo-img-${{ env.HUGO_VERSION }}-
      # Validates inputs, builds strictly, then asserts on the built site. `make check` is the
      # same command a developer runs, so CI cannot drift from local.
      # The gates are AI-written and have shipped five bugs of their own; the suite that
      # proves they still work runs before they are trusted to judge anything else.
      - name: Unit tests + coverage floor
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          make test
      - name: Run gates
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: make check

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      # Full history: the secret scan must see every commit, not the working tree. A
      # working-tree hook would not have caught a secret that was committed and later
      # removed, which is the shape most leaks actually have (CON-SEC-002).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 755 gitleaks "$RUNNER_TEMP/gitleaks" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secret scan (full history)
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

      # CON-SEC-003: the shipped tree and the build tree are audited separately, because a
      # single count misleads in both directions. Below is the BUILD half. The shipped half
      # lives in `make check`, which is the job that actually builds the site -- an assertion
      # about published output belongs with the other output assertions, not here.
      - name: Audit build-time Python
        run: |
          python3 -m pip install --quiet pip-audit
          pip-audit --requirement requirements-dev.txt --strict

      - name: Audit build-time Node
        run: npm audit --audit-level=high

      # CON-COV-001: application coverage says nothing about whether software ships. The
      # gates' OWN code is part of the delivery path -- a bug in pre-push stops gating
      # commits while every suite stays green -- so it is linted here rather than trusted.
      #
      # Both tools are pinned and run from a container / an ephemeral env, because neither
      # is installed on the development VM or guaranteed on the runner (CON-VER-004).
      - name: Lint the shell that runs the gates
        run: |
          docker run --rm -v "$PWD:/mnt" --user "$(id -u):$(id -g)" \
            koalaman/shellcheck:v0.10.0 --severity=style \
            scripts/check-local-gates.sh scripts/preflight.sh \
            .githooks/commit-msg .githooks/pre-commit .githooks/pre-push

      # Medium severity and above. The 224 Low findings are `assert` in the test suite --
      # where asserting IS the test -- and subprocess calls built from literal argv with no
      # shell. Gating on Low would mean suppressing 224 things, and an allowlist that long
      # is not read by anyone (spec 014).
      # In a container, not `pip install` on the runner: bandit 1.9.2 requires Python
      # >= 3.10 and the self-hosted runners are Ubuntu 20.04 with python3 3.8. Checked
      # before writing this step rather than discovered from a red build (CON-VER-004).
      - name: Scan the Python for security defects
        run: |
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" -e HOME=/tmp \
            python:3.12-slim bash -c \
            'pip install --quiet --no-warn-script-location bandit==1.9.2 && \
             python -m bandit -r scripts/ -ll -q'

  visual:
    name: visual regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources/_gen
          key: hugo-img-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'hugo.toml') }}
          restore-keys: |
            hugo-img-${{ env.HUGO_VERSION }}-
      # `make visual` runs Playwright inside the pinned container, exactly as it does locally.
      # Baselines were recorded in that same image, so rendering matches; running Playwright
      # directly on the runner would compare against different font rasterisation and fail.
      - name: Visual regression
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: make visual
      # On failure these contain *-diff.png showing precisely what moved.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
