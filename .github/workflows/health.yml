# Watches the system when nobody is changing it.
#
# Every other workflow here is triggered by a commit, so nothing notices decay: an
# expired certificate, DNS moving, a deploy that quietly stopped happening, a gate that
# has gone stale. This runs on a schedule against the LIVE site, plus the full local
# suite, so rot surfaces without anyone opening a pull request.
name: Health

on:
  schedule:
    # Mondays, 07:00 UTC. Weekly is enough for a site that changes a few times a month.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      canary:
        # CON-OBS-003: an alert path is verified by firing it once. Configured is not working --
        # this repo's reporter was added after four silent red Mondays and had never fired.
        description: "Fail on purpose, to prove a red run reaches a person (opens the issue)"
        type: boolean
        default: false

permissions:
  contents: read

# A weekly job: a second run waits rather than racing the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  live:
    name: live site
    runs-on: ubuntu-latest
    # Under a minute in every run seen; the default is 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Only ever set by a person dispatching the workflow; a schedule has no inputs.
      - name: Canary - fail on purpose
        if: ${{ inputs.canary }}
        run: |
          echo "::error::Deliberate failure (canary=true) to prove the alert path. Not an outage."
          exit 1
      - name: Check the deployed site
        run: python3 scripts/check-live.py

  suite:
    name: suite still current
    runs-on: ubuntu-latest
    # Under 2 min in every run seen, cold build included; the default is 6 hours.
    timeout-minutes: 20
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - uses: actions/checkout@v5
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      # `make check` runs `make test`, which needs coverage and pytest (#24). Without
      # this the job failed every Monday from 2026-10-12 with "No module named
      # coverage" (tests/unit/test_regressions.py now guards every such job).
      - name: Install the gates' own requirements
        run: python3 -m pip install --quiet -r requirements-dev.txt
      # Deliberately NOT cached: a scheduled run is the one place a cold build is worth
      # having, because it proves the site still builds from nothing.
      - name: Full gates from a cold start
        run: make check
      - name: Visual regression
        run: make visual
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # A red scheduled run emails only whoever last edited the cron: file a failure,
  # close the issue on the next success.
  report-failure:
    needs: [live, suite]
    # Only main's runs speak for production; a dispatch on a branch does not.
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "Weekly health check is failing"
      # Either job failing is the health check failing.
      result: ${{ (needs.live.result == 'failure' || needs.suite.result == 'failure') && 'failure' || ((needs.live.result == 'cancelled' || needs.suite.result == 'cancelled') && 'cancelled' || needs.suite.result) }}
