# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    # Under 1.5 min in every run seen (2026-10-07..11-07); the default is 6 hours.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      # Hugo caches processed image variants (see [caches.images] in hugo.toml).
      # Without this, every deploy regenerates all ~187 variants from scratch.
      # Measured on this runner: 43.8s cold vs 0.35s with the cache restored.
      # The restore-keys fallback means adding one painting reuses the other 47
      # artworks' variants instead of rebuilding everything.
      #
      # Note on scoping: GitHub isolates caches by ref. Runs on main share one
      # cache; a pull_request run writes to a PR-scoped cache but can still read
      # main's. So a cache miss on a branch's first run is expected, not a fault.
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources/_gen
          key: hugo-img-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'hugo.toml') }}
          restore-keys: |
            hugo-img-${{ env.HUGO_VERSION }}-
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # Gate the deploy itself, not just pull requests. A direct push to main --
      # or a merge that raced past review -- previously reached production with
      # nothing validating it. Failing here means a broken site is never
      # published, and unlike branch protection it needs no repository setting.
      - name: Validate before publishing
        run: |
          python3 scripts/check-specs.py
          python3 scripts/check-content.py
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          # The worker's cache is named after this commit (FLEET.md, PWA standard).
          HUGO_BUILD_COMMIT: ${{ github.sha }}
        # The same command every test path uses (CON-COV-005). This step used to run its own
        # `hugo --minify --baseURL ...`, so the browser suite only ever exercised a build that
        # never shipped.
        run: make build BASE_URL="${{ steps.pages.outputs.base_url }}/"
      # The build succeeded -- but Hugo answers a missing resource with a silent
      # fallback, so success proves little. Assert on what is about to ship.
      - name: Assert on the built site
        run: python3 scripts/check-output.py public
      # And drive a browser over that same artifact before it is uploaded: screenshots,
      # accessibility, the lightbox. Pull requests prove the change; this proves the bytes.
      - name: Browser suite on the artifact about to ship
        run: make visual-built
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
